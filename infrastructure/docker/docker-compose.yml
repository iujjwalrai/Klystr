# Backing services for local development.
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
name: klystr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klystr
      POSTGRES_USER: klystr
      POSTGRES_PASSWORD: klystr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klystr -d klystr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
